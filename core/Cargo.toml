[package]
name = "audioconv-core"
version = "0.1.0"
edition = "2021"
description = "Konvertierlogik: ffprobe-Analyse, ffmpeg-Befehle, Fortschritt, Presets"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "sync", "fs"] }
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
