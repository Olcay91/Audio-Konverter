# Baut die App für Windows, macOS und Linux.
#
# - Tag pushen (z. B. `git tag v0.2.0 && git push origin v0.2.0`): Alles wird gebaut
#   und als Entwurf unter „Releases“ abgelegt. Dort prüfen und veröffentlichen.
# - Manuell unter „Actions → Release → Run workflow“: Nur bauen, ohne Release.
#   Die Dateien liegen dann als „Artifacts“ am Workflow-Lauf. Gut zum Testen.
#
# Die Version im Tag muss zu app/tauri.conf.json passen (scripts/set-version.mjs).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Legt den Release-Entwurf einmal an, damit die parallelen Builds nicht
  # jeweils einen eigenen erzeugen.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5

      - name: Version prüfen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./app/tauri.conf.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version $VERSION in app/tauri.conf.json. Vorher: node scripts/set-version.mjs $TAG"
            exit 1
          fi

      - name: Release-Entwurf anlegen
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Alte Entwürfe zum selben Tag entfernen (z. B. von abgebrochenen Läufen).
          # Entwürfe binden den Tag nicht, deshalb kann es sonst mehrere geben.
          for OLD in $(gh api "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id"); do
            echo "Entferne alten Entwurf $OLD"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$OLD"
          done
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Audio Konverter $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n1)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    # Läuft auch ohne Tag (manuell), dann wird create-release übersprungen.
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-arm64
            os: macos-14
            triple: aarch64-apple-darwin
            # app: Archiv für den Updater in der App, dmg: für neue Installationen
            bundles: app,dmg
            macos_target: '11.0'
          - name: macos-x64
            # Intel-Runner; falls GitHub ihn einstellt: auf macos-14 mit Cross-Build umstellen
            os: macos-15-intel
            triple: x86_64-apple-darwin
            # app: Archiv für den Updater in der App, dmg: für neue Installationen
            bundles: app,dmg
            macos_target: '10.15'
          - name: linux-x64
            # Älteres Ubuntu = ältere glibc = AppImage läuft auf mehr Distributionen
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # ---------- Werkzeuge ----------

      - name: Linux-Pakete
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf nasm pkg-config

      - name: macOS-Pakete
        if: runner.os == 'macOS'
        run: brew install nasm pkgconf

      - name: MSYS2 (für ffmpeg unter Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-lame
            mingw-w64-ucrt-x86_64-libogg
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-opus

      # ---------- ffmpeg (schlanker Audio-Build, wird zwischengespeichert) ----------

      - name: ffmpeg aus dem Cache
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: build/ffmpeg/out
          key: ffmpeg-${{ matrix.triple }}-${{ hashFiles('scripts/ffmpeg/build.sh') }}

      - name: ffmpeg bauen (Linux/macOS)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
        run: bash scripts/ffmpeg/build.sh

      - name: ffmpeg bauen (Windows)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        env:
          USE_SYSTEM_LIBS: '1'
        run: bash scripts/ffmpeg/build.sh

      - name: ffmpeg als Sidecar ablegen
        shell: bash
        run: |
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          node scripts/prepare-ffmpeg.mjs "build/ffmpeg/out/ffmpeg$EXT" "build/ffmpeg/out/ffprobe$EXT" ${{ matrix.triple }}

      # ---------- App ----------

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}

      - run: npm ci

      # Signiert die Update-Pakete. Die Schlüssel liegen als Repository-Secrets vor
      # (Settings → Secrets and variables → Actions), siehe docs/ENTWICKLUNG.md → Updates.
      - name: App bauen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # latest.json für den Updater in der App (wird über alle Plattformen zusammengeführt)
          includeUpdaterJson: true
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --config app/tauri.ffmpeg.conf.json --bundles ${{ matrix.bundles }}

      # ---------- Portable Windows-Version ----------

      - name: Portable ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./app/tauri.conf.json').version"
          $name = "Audio-Konverter-$version-windows-x64-portable"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/audioconv-app.exe "$name/Audio Konverter.exe"
          Copy-Item target/release/audiokonverter-ffmpeg.exe, target/release/audiokonverter-ffprobe.exe $name
          Copy-Item THIRD_PARTY_NOTICES.md, build/ffmpeg/out/FFMPEG-BUILD.txt $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "PORTABLE_ZIP=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Über die Release-ID statt den Tag-Namen, damit die Datei sicher im richtigen Entwurf landet
      - name: Portable ZIP zum Release hinzufügen
        if: runner.os == 'Windows' && needs.create-release.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/zip" \
            --data-binary @"$PORTABLE_ZIP" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$PORTABLE_ZIP" \
            -o /dev/null
          echo "$PORTABLE_ZIP hochgeladen"

      # Bei manuellen Läufen: Ergebnisse als Artifact zum Herunterladen
      - name: Ergebnisse ablegen (ohne Release)
        if: needs.create-release.result == 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: audio-konverter-${{ matrix.name }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            *-portable.zip
          if-no-files-found: error
