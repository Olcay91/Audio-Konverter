# Standard-Presets, gruppiert nach Format. Werden in die App eingebettet.
# Eigene Presets speichert die App separat (presets.json im Konfigurationsordner).
#
# codec:  mp3 | aac | opus | vorbis | flac | alac | wav | aiff
# rate:   { mode = "quality", value = N }   Qualitätsstufe (MP3: 0–9, Vorbis: -1–10)
#         { mode = "bitrate", kbps = N }    Zielbitrate
#         { mode = "lossless" }             optional: compression = 0–12 (nur FLAC)
# optional: sample_rate, bit_depth, channels – jeweils Obergrenzen, es wird nie
# hochgerechnet. Ohne Angabe gilt der Wert der Quelle.

# ---------- MP3 ----------
[[preset]]
id = "mp3-v0"
name = "V0 (VBR, ca. 245 kbit/s)"
description = "Beste MP3-Qualität bei variabler Bitrate"
codec = "mp3"
rate = { mode = "quality", value = 0 }

[[preset]]
id = "mp3-v2"
name = "V2 (VBR, ca. 190 kbit/s)"
description = "Sehr gute Qualität, kleinere Dateien"
codec = "mp3"
rate = { mode = "quality", value = 2 }

[[preset]]
id = "mp3-320"
name = "320 kbit/s (CBR)"
description = "Konstante Bitrate, maximale Kompatibilität"
codec = "mp3"
rate = { mode = "bitrate", kbps = 320 }

[[preset]]
id = "mp3-192"
name = "192 kbit/s (CBR)"
description = "Guter Kompromiss für Autoradio und Handy"
codec = "mp3"
rate = { mode = "bitrate", kbps = 192 }

[[preset]]
id = "mp3-128"
name = "128 kbit/s (CBR)"
description = "Kleine Dateien, z. B. für Hörbücher"
codec = "mp3"
rate = { mode = "bitrate", kbps = 128 }

